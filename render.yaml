services:
  - type: web
    name: luxury-car-showroom
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn luxury_car_showroom.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        value: your-secret-key-change-this
      - key: DEBUG
        value: "False"